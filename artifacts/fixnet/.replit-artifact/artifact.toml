kind = "web"
previewPath = "/"
title = "FixNet Unlimited"
version = "1.0.0"
id = "artifacts/fixnet"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25413

[services.development]
run = "pnpm --filter @workspace/fixnet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fixnet", "run", "build" ]
serve = "static"
publicDir = "artifacts/fixnet/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25413"
BASE_PATH = "/"
